# GitHub Pages (Jekyll) renders README.md as the home page and the other .md files as pages.
title: upload_inspector
description: Fail-closed structural inspection of untrusted uploaded files for Ruby and Rails
theme: jekyll-theme-cayman
plugins:
  - jekyll-optional-front-matter # render the .md files without front matter
  - jekyll-readme-index          # README.md is the home page
  - jekyll-relative-links        # [THREAT_MODEL.md](THREAT_MODEL.md) keeps working
  - jekyll-github-metadata
relative_links:
  enabled: true
  collections: false
exclude: [lib, test, plans, Gemfile, Gemfile.lock, Rakefile, upload_inspector.gemspec, vendor, tmp, LICENSE.txt]
