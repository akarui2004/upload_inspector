name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ruby ${{ matrix.ruby }} / rubyzip ${{ matrix.rubyzip }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.2', '3.3', '3.4']
        rubyzip: ['~> 2.3.0', '~> 3.0']
    env:
      RUBYZIP_VERSION: ${{ matrix.rubyzip }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake test

  # sanitize(reencode: true) and the real-decoder cross-checks: libvips, ImageMagick, HEIF encoders.
  sanitize-decoders:
    name: Sanitize with libvips / ImageMagick
    runs-on: ubuntu-24.04
    env:
      BUNDLE_WITH: vips
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvips-tools imagemagick libheif-plugin-x265 libheif-plugin-aomenc
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # Every decoder is installed here, so a skipped cross-check is a failure.
      - run: bundle exec ruby -Ilib -Itest test/sanitize_test.rb --verbose | tee sanitize.log && ! grep -q 'Skipped:' sanitize.log

  # Shrine, CarrierWave, Active Storage analyzer and Rack middleware against the real gems.
  integrations:
    name: Integrations (Shrine, CarrierWave, Active Storage, Rack)
    runs-on: ubuntu-latest
    env:
      BUNDLE_WITH: integration
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # The gems are installed here, so a skipped integration test is a failure.
      - run: >-
          bundle exec ruby -Ilib -Itest -e 'Dir["test/integrations/*_test.rb"].each { require_relative _1 }' -- --verbose
          | tee integrations.log && ! grep -q 'Skipped:' integrations.log

  # Scanners::ClamAV against a real clamd with the EICAR test file.
  clamav:
    name: ClamAV scanner
    runs-on: ubuntu-latest
    services:
      clamd:
        image: clamav/clamav:stable
        ports: ['3310:3310']
        # Loading the signature database takes a minute or two.
        options: >-
          --health-cmd clamdcheck.sh --health-interval 10s --health-timeout 10s
          --health-retries 30 --health-start-period 60s
    env:
      CLAMD_HOST: localhost
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      # clamd is running here, so a skipped real-clamd test is a failure.
      - run: bundle exec ruby -Ilib -Itest test/scanners_test.rb --verbose | tee clamav.log && ! grep -q 'Skipped:' clamav.log
